<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>승승 온라인 보드게임 카페</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= 로비 ================= -->
<section id="screen-lobby" class="screen">
  <div class="lobby-wrap">
    <header class="lobby-header">
      <h1>승승 <span>온라인 보드게임 카페</span></h1>
    </header>
    <div id="invite-banner" class="panel invite-banner hidden">
      <span>🔗 초대받은 방 <strong id="invite-room-name">-</strong>에 입장합니다. 닉네임을 확인하고 입장하세요.</span>
      <button id="btn-invite-join" class="btn gold small">입장하기</button>
    </div>
    <div class="lobby-body">
      <div class="lobby-left panel">
        <h2>내 정보</h2>
        <label class="field">
          <span>닉네임</span>
          <input id="input-name" maxlength="12" placeholder="닉네임 입력">
        </label>
        <h2>방 만들기</h2>
        <label class="field">
          <span>게임</span>
          <select id="input-room-game"></select>
        </label>
        <label class="field">
          <span>방 이름</span>
          <input id="input-room-name" maxlength="20" placeholder="방 이름">
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input id="input-room-pw" maxlength="20" placeholder="(선택) 비밀번호">
        </label>
        <button id="btn-create" class="btn gold">방 만들기</button>
      </div>
      <div class="lobby-right panel">
        <h2>게임 대기룸 목록</h2>
        <ul id="room-list" class="room-list"></ul>
        <p id="room-list-empty" class="muted">아직 열린 방이 없습니다. 새 방을 만들어 보세요!</p>
      </div>
    </div>
  </div>
</section>

<!-- ================= 대기실 ================= -->
<section id="screen-room" class="screen">
  <div class="room-wrap">
    <header class="room-header">
      <h2 id="room-title">방 이름</h2>
    </header>
    <div id="room-footer-actions" class="room-footer-actions panel">
      <button id="btn-invite" class="btn small" title="초대 링크 복사">🔗 초대 링크 복사</button>
      <button id="btn-leave" class="btn small danger">나가기</button>
    </div>
    <div class="room-body">
      <div id="room-seats" class="room-seats"></div>
      <div class="room-controls panel">
        <div id="host-controls" class="host-controls">
          <label class="field inline">
            <span>게임</span>
            <select id="select-game"></select>
          </label>
          <label class="field inline">
            <span>최대 인원</span>
            <select id="select-max"></select>
          </label>
          <div id="setup-slot"></div>
          <button id="btn-add-bot" class="btn small">🤖 봇 추가</button>
        </div>
        <div class="room-actions">
          <button id="btn-ready" class="btn">준비</button>
          <button id="btn-start" class="btn gold">게임 시작</button>
        </div>
        <p class="muted small-text">부족한 인원은 봇으로 채울 수 있습니다</p>
      </div>
    </div>
  </div>
</section>

<!-- ================= 게임 (게임별 HUD·팝업은 활성 게임 클라이언트가 주입) ================= -->
<section id="screen-game" class="screen">
  <canvas id="game-canvas"></canvas>
  <div id="game-hud">
    <div class="hud-top-left">
      <span id="game-room-name"></span>
      <button id="btn-game-leave" class="btn tiny danger">나가기</button>
    </div>
    <div id="game-hud-slot"></div>
  </div>
</section>

<div id="toast"></div>

<!-- ================= 음성채팅 / 채팅 (게임 화면: 우측 상단 고정 / 대기룸: 상단 액션 줄로 이동) ================= -->
<span id="side-widgets-home"></span>
<div id="side-widgets" class="side-widgets hidden">
  <button id="btn-voice-toggle" class="btn tiny widget-btn" title="음성채팅 켜기/끄기">🔇 음성</button>
  <button id="btn-mic-toggle" class="btn tiny widget-btn" title="마이크 켜기/끄기" disabled>🎙️</button>
  <button id="btn-chat-toggle" class="btn tiny widget-btn" title="채팅">💬<span id="chat-badge" class="chat-badge hidden"></span></button>
</div>
<div id="chat-panel" class="panel chat-panel hidden">
  <header class="chat-header">
    <span>채팅</span>
    <button class="popup-close" id="btn-chat-close">✕</button>
  </header>
  <div id="chat-messages" class="chat-messages"></div>
  <div class="chat-input-row">
    <input id="chat-input" maxlength="200" placeholder="메시지 입력">
    <button id="btn-chat-send" class="btn tiny">전송</button>
  </div>
</div>

<!-- 채팅 말풍선: 캔버스 위에 그리면 다른 UI(z-index)에 가려지므로 항상 최상단에 뜨는 별도 레이어로 분리 -->
<div id="chat-bubbles-layer" class="chat-bubbles-layer"></div>

<!-- 규칙 엔진(공용) -->
<script src="shared/lexio-core.js"></script>
<script src="shared/felicity-core.js"></script>
<script src="shared/poker-core.js"></script>
<script src="shared/tetris-core.js"></script>
<!-- 게임 독립 모듈 -->
<script src="js/sound.js"></script>
<script src="js/voice.js"></script>
<script src="js/core/net.js"></script>
<script src="js/core/modal.js"></script>
<script src="js/core/chat.js"></script>
<script src="js/core/widgets.js"></script>
<script src="js/games/registry.js"></script>
<!-- 게임 플러그인 -->
<script src="js/games/lexio/ui.js"></script>
<script src="js/games/lexio/index.js"></script>
<script src="js/games/felicity/ui.js"></script>
<script src="js/games/felicity/index.js"></script>
<script src="js/games/uno/ui.js"></script>
<script src="js/games/uno/index.js"></script>
<script src="js/games/holdem/ui.js"></script>
<script src="js/games/holdem/index.js"></script>
<script src="js/games/seven/ui.js"></script>
<script src="js/games/seven/index.js"></script>
<script src="js/games/notthanks/ui.js"></script>
<script src="js/games/notthanks/index.js"></script>
<script src="js/games/tetris/engine.js"></script>
<script src="js/games/tetris/ui.js"></script>
<script src="js/games/tetris/index.js"></script>
<!-- 셸(부팅) -->
<script src="js/core/shell.js"></script>
</body>
</html>
